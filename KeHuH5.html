<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2473ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title></title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --safe-top: constant(safe-area-inset-top);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: constant(safe-area-inset-right);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-left: constant(safe-area-inset-left);
      --safe-left: env(safe-area-inset-left, 0px);
      --header-blue: 106px;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #2473ea;
    }
    .page {
      				margin-top: 30px;
      min-height: 100vh;
      min-height: 100dvh;
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      background: linear-gradient(
        180deg,
        #2473ea 0 calc(var(--header-blue) + var(--safe-top)),
        #f5f5f5 calc(var(--header-blue) + var(--safe-top)) 100%
      );
    }
    .header {
      padding: calc(24px + var(--safe-top)) 14px 18px;
    }
    .search-row { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 8px; align-items: center; }
    .search-input { height: 36px; width: 100%; border: 0; border-radius: 4px; background: #fff; padding: 0 12px; font-size: 14px; color: #111; outline: none; }
    .search-btn { height: 36px; width: 36px; border: 0; border-radius: 4px; background: #fff; color: #111; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .main { display: grid; gap: 16px; padding: 14px; }
    .state { padding: 48px 16px; text-align: center; font-size: 14px; color: #7d8394; }
    .state-title { margin: 0 0 8px; font-size: 16px; color: #1f2430; font-weight: 700; }
    .state-msg { margin: 0; line-height: 1.5; word-break: break-word; }
    .retry-btn { margin-top: 16px; height: 34px; border: 0; border-radius: 4px; background: #2473ea; color: #fff; font-size: 14px; font-weight: 700; padding: 0 18px; cursor: pointer; }
    .card { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 16px; align-items: start; background: #fff; padding: 18px 16px; border-radius: 8px; box-shadow: 0 8px 26px rgba(26, 35, 57, 0.08); }
    .card img { width: 62px; height: 62px; object-fit: cover; background: #dde3ef; }
    .card-title { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 800; color: #000; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-time { margin: 12px 0 0; font-size: 12px; color: #a1a5b3; line-height: 1.2; }
    .hidden { display: none !important; }
    .mask { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.58); padding: 310px 16px 0; }
    .modal { max-width: 377px; margin: 0 auto; background: #fff; border-radius: 18px; padding: 18px 16px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.22); }
    .modal-close { display: flex; justify-content: flex-end; }
    .icon-btn { width: 28px; height: 28px; border: 0; background: transparent; color: #c6ccd7; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .verify-wrap { padding: 64px 0 88px; }
    .track { position: relative; width: 302px; height: 40px; margin: 0 auto; overflow: hidden; border-radius: 4px; background: #f2f3f7; }
    .track-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; background: linear-gradient(90deg,#0e63ff 0%,#1e7cff 100%); width: 40px; transition: width .2s; }
    .track-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4a4f59; line-height: 1; }
    .track-text.verified { color: #fff; }
    .knob { position: absolute; left: 0; top: 0; z-index: 2; width: 40px; height: 40px; border: 0; background: #0e63ff; color: #fff; touch-action: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .2s; }
    .message-mask { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.58); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .message-panel { width: min(100%,320px); background: #fff; border-radius: 12px; padding: 20px 18px 16px; box-shadow: 0 20px 60px rgba(0,0,0,.22); text-align: center; }
    .message-title { margin: 0 0 10px; font-size: 16px; font-weight: 700; color: #1f2430; }
    .message-text { margin: 0; font-size: 14px; line-height: 1.5; color: #4a4f59; word-break: break-word; }
    .message-btn { width: 100%; margin-top: 18px; height: 38px; border: 0; border-radius: 6px; background: #2473ea; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>

  <div class="page">

          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="M16 16L20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
          </svg>
        </button>
      </div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <div id="verifyMask" class="mask hidden">

        <div id="track" class="track">

          <div id="trackText" class="track-text">Swiping to the right side</div>

            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6L15 12L9 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="messageMask" class="message-mask hidden">
    <div class="message-panel">
      <p class="message-title">Tip</p>
      <p id="messageText" class="message-text"></p>
      <button id="messageOk" class="message-btn" type="button">OK</button>
    </div>
  </div>

    const NEWS_LIST_URL = 'https://api.kkjkldskf.cc/api/news/list';

    const state = {

    function qsIndex() {

    function pickString(obj, keys) {
      for (const k of keys) {
        const v = obj[k];
        if (typeof v === 'string' && v.trim()) return v.trim();
      }
      return '';
    }

    function pickNumber(obj, keys) {
      for (const k of keys) {
        const v = obj[k];
        if (typeof v === 'number' && Number.isFinite(v)) return v;
        if (typeof v === 'string' && v.trim() && !Number.isNaN(Number(v))) return Number(v);
      }
      return 0;
    }

    function formatDate(raw) {
      if (!raw) return '';
      if (/^\d+$/.test(raw)) {
        const n = Number(raw);
        const ms = raw.length === 10 ? n * 1000 : n;
        const d = new Date(ms);
        if (!Number.isNaN(d.getTime())) return padDate(d);
      }
      const d = new Date(raw);
      return Number.isNaN(d.getTime()) ? raw : padDate(d);
    }

    function padDate(d) {
      const p = (n) => String(n).padStart(2, '0');
      return `${p(d.getMonth()+1)}/${p(d.getDate())}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function placeholder(title) {
      const label = (title || 'NEWS').slice(0, 8).toUpperCase();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="124" height="124" viewBox="0 0 124 124"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#427ee8"/><stop offset="100%" stop-color="#16243d"/></linearGradient></defs><rect width="124" height="124" fill="url(#g)"/><rect x="0" y="82" width="124" height="42" fill="rgba(0,0,0,0.38)"/><text x="10" y="106" fill="white" font-size="17" font-family="Arial,sans-serif" font-weight="700">${label}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function normalizeList(payload) {
      if (Array.isArray(payload)) return payload;
      if (Array.isArray(payload?.list)) return payload.list;
      if (Array.isArray(payload?.rows)) return payload.rows;
      if (Array.isArray(payload?.items)) return payload.items;
      if (payload?.data && !Array.isArray(payload.data)) {
        if (Array.isArray(payload.data.list)) return payload.data.list;
        if (Array.isArray(payload.data.rows)) return payload.data.rows;
        if (Array.isArray(payload.data.data)) return payload.data.data;
      }
      return Array.isArray(payload?.data) ? payload.data : [];
    }

    function mapItem(row, i) {
      const title = pickString(row, ['title','news_title','post_title','name','subject']) || ('News ' + (i + 1));
      const publishedAt = formatDate(pickString(row, ['publish_time','published_at','publishedAt','create_time','created_at','createdAt','add_time','date','time']));
      const image = pickString(row, ['logo','thumbnail','image','img','cover','cover_img','cover_image','pic','picture']) || placeholder(title);
      return {
        id: pickNumber(row, ['id','news_id','article_id']) || (i + 1),
        title,
        publishedAt: publishedAt || '--',
        image,
      };
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function render() {
      const main = els.main;
      if (state.loading) {
        main.innerHTML = '<div class="state">Loading news...</div>';
        return;
      }
      if (state.error) {
        main.innerHTML = '<div class="state"><p class="state-title">Failed to load news.</p><p class="state-msg">' + escapeHtml(state.error) + '</p><button class="retry-btn" type="button" id="retryBtn">Retry</button></div>';
        document.getElementById('retryBtn').onclick = loadNews;
        return;
      }
      const list = state.allNews;
      if (!list.length) {
        main.innerHTML = '<div class="state">No results found.</div>';
        return;
      }
      main.innerHTML = list.map((item) => (
        '<article class="card">' +
          '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.title) + '" />' +
          '<div><h2 class="card-title">' + escapeHtml(item.title) + '</h2><p class="card-time">' + escapeHtml(item.publishedAt) + '</p></div>' +
        '</article>'
      )).join('');
    }

    async function fetchJson(url) {
      const res = await fetch(url, { method: 'GET' });
      const data = await res.json();
      if (data.code !== 1) throw new Error(data.msg || 'Request failed');
      return data.data;
    }

    async function loadNews() {
      state.loading = true;
      state.error = '';
      render();
      const index = qsIndex();
      const liveUrl = NEWS_LIST_URL + '?category_id=31&inde_id=' + encodeURIComponent(index) + '&page=2&t=' + Date.now();
      try {
        const payload = await fetchJson(liveUrl);
        state.allNews = normalizeList(payload).map(mapItem);
      } catch (e) {
        try {
          state.allNews = normalizeList({ data: { data: EMBEDDED_NEWS } }).map(mapItem);
          if (!state.allNews.length) throw e;
        } catch (_) {
          state.error = (e && e.message) ? e.message : 'Failed to load news.';
          state.allNews = [];
        }
      } finally {
        state.loading = false;
        render();
      }
    }

    function showTip(msg) {
      els.messageText.textContent = msg || 'Failed to load news.';
      els.messageMask.classList.remove('hidden');
    }

    function hideTip() { els.messageMask.classList.add('hidden'); }

    function openVerify() {
      resetVerify();
      els.verifyMask.classList.remove('hidden');
    }

    function closeVerify() {
      els.verifyMask.classList.add('hidden');
      resetVerify();
    }

    let dragging = false;
    let verified = false;
    let offset = 0;
    let startX = 0;
    let startOffset = 0;

    function maxOffset() {
      const w = els.track.clientWidth || 302;
      return Math.max(w - KNOB, 0);
    }

    function applyKnob() {
      els.knob.style.transform = 'translateX(' + offset + 'px)';
      els.trackFill.style.width = (offset + KNOB) + 'px';
    }

    function resetVerify() {
      dragging = false;
      verified = false;
      offset = 0;
      startX = 0;
      startOffset = 0;
      els.trackText.textContent = 'Swiping to the right side';
      els.trackText.classList.remove('verified');
      applyKnob();
    }

    function completeVerify() {
      verified = true;
      offset = maxOffset();
      els.trackText.textContent = 'Verified';
      els.trackText.classList.add('verified');
      applyKnob();
      setTimeout(async () => {
        closeVerify();
        try {
          const name = state.pendingSearch;
          const url = COMPANY_URL + '?name=' + encodeURIComponent(name) + '&like=1&t=' + Date.now();
          const rows = await fetchJson(url);
          if (Array.isArray(rows) && rows.length && rows[0].url) {
            localStorage.setItem('redirectUrl', rows[0].url);
            location.href = rows[0].url;
          }
        } catch (e) {
          showTip((e && e.message) ? e.message : 'Request failed');
        }
      }, 220);
    }

    function onSearch() {
      const text = els.searchInput.value.trim();
      if (!text) return;
      state.pendingSearch = text;
      openVerify();
    }

    els.searchBtn.addEventListener('click', onSearch);
    els.searchInput.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') onSearch(); });
    els.verifyClose.addEventListener('click', closeVerify);
    els.messageOk.addEventListener('click', hideTip);
    els.messageMask.addEventListener('click', (ev) => { if (ev.target === els.messageMask) hideTip(); });

    els.knob.addEventListener('pointerdown', (ev) => {
      if (verified) return;
      dragging = true;
      startX = ev.clientX;
      startOffset = offset;
      ev.currentTarget.setPointerCapture?.(ev.pointerId);

    });

    window.addEventListener('pointermove', (ev) => {
      if (!dragging || verified) return;
      offset = Math.min(Math.max(startOffset + ev.clientX - startX, 0), maxOffset());
      applyKnob();
      if (offset >= maxOffset()) {
        dragging = false;
        completeVerify();
      }
    });

    window.addEventListener('pointerup', () => {
      if (!dragging || verified) return;
      dragging = false;
      offset = 0;
      applyKnob();

    (function init() {
      const redirect = localStorage.getItem('redirectUrl');
      const q = location.search || '';
      if (location.pathname.endsWith('index.html') || location.pathname.endsWith('/')) {
        history.replaceState(null, '', 'index.html' + q);
      }
      if (redirect) {
        location.href = redirect;
        return;
      }
      loadNews();
    })();
  </script>
</body>
